<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaultDemo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #07090d;
  --panel:    #0c0f15;
  --edge:     rgba(255,255,255,0.06);
  --edge2:    rgba(255,255,255,0.11);
  --text:     #dde0ea;
  --sub:      #3e4459;
  --dim:      #1a1e2a;
  --green:    #00c97a;
  --glow:     rgba(0,201,122,0.08);
  --red:      #ff4d6a;
  --amber:    #e8960a;
  --mono:     'DM Mono', monospace;
  --serif:    'Instrument Serif', serif;
  --bar:      52px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--bg); }
body {
  font-family:var(--mono); color:var(--text);
  min-height:100dvh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* grid texture */
body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* corner glow */
body::before {
  content:''; position:fixed; bottom:-180px; right:-180px;
  width:480px; height:480px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,201,122,0.07) 0%, transparent 65%);
  pointer-events:none; z-index:0;
}

/* ── NAV ── */
nav {
  position:fixed; top:0; left:0; right:0; z-index:50;
  height:var(--bar);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 clamp(1rem,5vw,2.5rem);
  background:rgba(7,9,13,0.8); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--edge);
}
.nav-logo {
  font-family:var(--serif); font-size:1.15rem; font-style:italic;
  letter-spacing:0.01em; color:var(--text);
}
.nav-logo b { font-style:normal; color:var(--green); font-family:var(--serif); }
.nav-tag {
  font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--sub); display:flex; align-items:center; gap:7px;
}
.pulse {
  width:5px; height:5px; border-radius:50%;
  background:var(--green); box-shadow:0 0 5px var(--green);
  animation:pulse 2.4s ease-in-out infinite;
}

/* ── SHELL ── */
.shell {
  position:relative; z-index:1;
  min-height:100dvh; padding-top:var(--bar);
  display:flex; flex-direction:column;
}

/* ── SCREENS ── */
.view {
  display:none; flex:1;
  align-items:center; justify-content:center;
  padding:clamp(1.25rem,5vw,2.5rem) clamp(1rem,4vw,2rem);
}
.view.on { display:flex; animation:up .35s cubic-bezier(.22,1,.36,1) both; }

/* ── CARD ── */
.card {
  width:100%; max-width:400px;
  background:var(--panel);
  border:1px solid var(--edge2);
  border-radius:16px;
  overflow:hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 24px 64px rgba(0,0,0,0.5);
}

/* accent line top */
.card-accent { height:1px; background:linear-gradient(90deg, var(--green) 0%, transparent 60%); }
.card-accent.amber { background:linear-gradient(90deg, var(--amber) 0%, transparent 60%); }

.card-body { padding:clamp(1.5rem,5vw,2rem); }

/* ── LABEL ── */
.lbl {
  font-size:0.58rem; letter-spacing:0.16em; text-transform:uppercase;
  color:var(--sub); display:block; margin-bottom:7px;
}

/* ── INPUT ── */
.inp {
  width:100%; background:var(--dim); border:1px solid var(--edge);
  border-radius:9px; padding:0.75rem 1rem;
  color:var(--text); font-family:var(--mono); font-size:0.9rem;
  outline:none; transition:border-color .18s, box-shadow .18s;
  -webkit-appearance:none; appearance:none;
}
.inp:focus { border-color:var(--green); box-shadow:0 0 0 3px var(--glow); }
.inp.amber:focus { border-color:var(--amber); box-shadow:0 0 0 3px rgba(232,150,10,0.1); }
.inp.err { border-color:var(--red) !important; box-shadow:0 0 0 3px rgba(255,77,106,0.1) !important; }
.inp[readonly] { opacity:0.5; cursor:default; }

/* single large OTP input */
.otp-inp {
  width:100%;
  background:var(--dim); border:1px solid var(--edge);
  border-radius:9px; padding:0.9rem 1rem;
  color:var(--green); font-family:var(--mono); font-size:1.35rem;
  font-weight:500; letter-spacing:0.22em; text-align:center;
  text-transform:uppercase; outline:none;
  transition:border-color .18s, box-shadow .18s;
  -webkit-appearance:none; appearance:none;
}
.otp-inp:focus { border-color:var(--green); box-shadow:0 0 0 3px var(--glow); }
.otp-inp::placeholder { color:var(--sub); letter-spacing:0.1em; font-size:1rem; }

/* ── FIELD WRAPPER ── */
.field { margin-bottom:1.1rem; }
.field:last-of-type { margin-bottom:0; }

/* ── MSG (under field) ── */
.msg { font-size:0.6rem; margin-top:6px; min-height:14px; transition:color .2s; color:var(--sub); }
.msg.ok  { color:var(--green); }
.msg.err { color:var(--red); }

/* ── DIVIDER ── */
.sep { height:1px; background:var(--edge); margin:1.4rem 0; }

/* ── BTN ── */
.btn {
  width:100%; padding:0.82rem 1rem; border-radius:9px; border:none;
  font-family:var(--mono); font-size:0.82rem; letter-spacing:0.04em;
  cursor:pointer; transition:opacity .15s, transform .1s;
  display:flex; align-items:center; justify-content:center; gap:8px;
  -webkit-tap-highlight-color:transparent;
}
.btn:active { transform:scale(0.985); }
.btn:disabled { opacity:0.35; cursor:not-allowed; transform:none !important; }
.btn-green { background:var(--green); color:#07090d; font-weight:500; }
.btn-green:hover:not(:disabled) { opacity:0.88; }
.btn-ghost {
  background:transparent; color:var(--sub);
  border:1px solid var(--edge2); font-weight:400;
}
.btn-ghost:hover:not(:disabled) { color:var(--text); border-color:var(--edge2); }

/* ── STATUS ROW ── */
.status-row {
  display:flex; align-items:center; gap:8px;
  font-size:0.65rem; padding:0.6rem 0.8rem; border-radius:8px;
  margin-bottom:1.2rem; border:1px solid transparent; transition:all .25s;
  min-height:36px;
}
.status-row.idle   { background:rgba(255,255,255,0.02); border-color:var(--edge); color:var(--sub); }
.status-row.good   { background:rgba(0,201,122,0.07); border-color:rgba(0,201,122,0.18); color:var(--green); }
.status-row.bad    { background:rgba(255,77,106,0.06); border-color:rgba(255,77,106,0.18); color:var(--red); }

/* ── TIMER BAR ── */
.tbar { height:2px; background:var(--edge); border-radius:2px; margin-bottom:1rem; overflow:hidden; }
.tfill { height:100%; background:var(--green); border-radius:2px; transition:width 1s linear; }

/* ── BACK LINK ── */
.back { text-align:center; margin-top:1.2rem; font-size:0.65rem; }
.back a { color:var(--sub); text-decoration:none; cursor:pointer; transition:color .15s; }
.back a:hover { color:var(--text); }

/* ── DASHBOARD ── */
#v-dash { align-items:flex-start; justify-content:center; flex-direction:column; }
.dash {
  width:100%; max-width:680px; margin:0 auto;
  padding:clamp(1.5rem,5vw,2.5rem) clamp(1rem,4vw,2rem);
  animation:up .35s cubic-bezier(.22,1,.36,1) both;
}
.dash-head {
  display:flex; align-items:baseline; justify-content:space-between;
  flex-wrap:wrap; gap:10px; margin-bottom:0.4rem;
}
.dash-title {
  font-family:var(--serif); font-size:clamp(1.8rem,6vw,2.6rem);
  font-style:italic; line-height:1.1;
}
.dash-title span { color:var(--green); font-style:normal; }
.dash-sub { font-size:0.65rem; color:var(--sub); margin-bottom:2rem; }

.signout {
  background:none; border:none; cursor:pointer;
  font-family:var(--mono); font-size:0.65rem; color:var(--sub);
  transition:color .15s; padding:0;
}
.signout:hover { color:var(--red); }

.check-strip {
  display:flex; align-items:center; gap:10px;
  background:var(--glow); border:1px solid rgba(0,201,122,0.15);
  border-radius:10px; padding:0.85rem 1.1rem;
  font-size:0.7rem; color:var(--green); margin-bottom:1.5rem;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(min(100%, 200px), 1fr));
  gap:clamp(0.6rem,2vw,0.85rem);
}
.tile {
  background:var(--panel); border:1px solid var(--edge);
  border-radius:12px; padding:clamp(0.9rem,3vw,1.2rem);
  transition:border-color .2s;
}
.tile:hover { border-color:var(--edge2); }
.tile-lbl { font-size:0.56rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--sub); margin-bottom:0.5rem; }
.tile-val {
  font-family:var(--serif); font-style:italic;
  font-size:clamp(1.15rem,3.5vw,1.5rem); color:var(--text); line-height:1.2;
}
.tile-val em { color:var(--green); font-style:normal; font-family:var(--serif); }
.tile-val em.a { color:var(--amber); }
.tile-note { font-size:0.58rem; color:var(--sub); margin-top:5px; line-height:1.65; }

/* ── SPINNER ── */
.spin {
  width:13px; height:13px; border-radius:50%;
  border:1.5px solid var(--edge2); border-top-color:var(--green);
  animation:rot .6s linear infinite; display:inline-block; flex-shrink:0;
}
.spin.a { border-top-color:var(--amber); }

/* ── ANIMATIONS ── */
@keyframes up     { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
@keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.2} }
@keyframes rot    { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<nav>
  <div class="nav-logo"><b>Vault</b>Demo</div>
  <div class="nav-tag"><span class="pulse"></span>EntropyAuth</div>
</nav>

<div class="shell">

  <!-- ── VIEW 1: SIGN IN ── -->
  <div class="view on" id="v-login">
    <div class="card">
      <div class="card-accent amber"></div>
      <div class="card-body">
        <div class="status-row idle" id="srv-status">
          <span class="spin a"></span> Connecting…
        </div>

        <div class="field">
          <label class="lbl">Email</label>
          <input class="inp amber" type="email" id="f-email"
            placeholder="you@example.com"
            autocomplete="email" autocapitalize="none" autocorrect="off">
          <div class="msg" id="f-email-msg"></div>
        </div>

        <div class="field">
          <label class="lbl">Password</label>
          <input class="inp amber" type="password" id="f-pass"
            placeholder="••••••••"
            autocomplete="current-password">
          <div class="msg" id="f-pass-msg"></div>
        </div>

        <div class="sep"></div>

        <button class="btn btn-green" id="btn-login" onclick="doLogin()">
          Continue
        </button>
      </div>
    </div>
  </div>

  <!-- ── VIEW 2: VERIFY ── -->
  <div class="view" id="v-otp">
    <div class="card">
      <div class="card-accent"></div>
      <div class="card-body">

        <div class="field">
          <label class="lbl">
            Account
            <span id="uid-tag" style="color:var(--green);margin-left:6px"></span>
          </label>
          <input class="inp" type="text" id="f-uid"
            placeholder="resolving…" readonly autocomplete="off">
          <div class="msg" id="f-uid-msg"></div>
        </div>

        <div class="field">
          <label class="lbl">Entropy code</label>
          <div class="tbar"><div class="tfill" id="tfill" style="width:100%"></div></div>
          <input class="otp-inp" type="text" id="f-otp"
            maxlength="8" placeholder="· · · · · · · ·"
            autocomplete="one-time-code" inputmode="text"
            autocapitalize="characters" spellcheck="false"
            oninput="otpInput(this)" onpaste="otpPaste(event)">
          <div class="msg" id="f-otp-msg"></div>
        </div>

        <div class="sep"></div>

        <button class="btn btn-green" id="btn-verify" onclick="doVerify()">
          Verify
        </button>

        <div class="back"><a onclick="gotoLogin()">← back</a></div>
      </div>
    </div>
  </div>

  <!-- ── VIEW 3: DASHBOARD ── -->
  <div class="view" id="v-dash">
    <div class="dash">
      <div class="dash-head">
        <div class="dash-title">Hello, <span id="d-name">—</span></div>
        <button class="signout" onclick="gotoLogin()">sign out</button>
      </div>
      <div class="dash-sub" id="d-email">—</div>

      <div class="check-strip">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="#00c97a" stroke-width="1.2"/>
          <path d="M5 8l2.2 2.2L11 6" stroke="#00c97a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Identity verified via EntropyAuth
      </div>

      <div class="grid">
        <div class="tile">
          <div class="tile-lbl">Method</div>
          <div class="tile-val"><em>Entropy</em>Auth</div>
          <div class="tile-note">HMAC-SHA256 · webcam entropy</div>
        </div>
        <div class="tile">
          <div class="tile-lbl">Session</div>
          <div class="tile-val" id="d-time">—</div>
          <div class="tile-note">±30 s OTP window</div>
        </div>
        <div class="tile">
          <div class="tile-lbl">User</div>
          <div class="tile-val" style="font-size:1rem;word-break:break-all" id="d-email2">—</div>
          <div class="tile-note">Google UID · chaos seed</div>
        </div>
        <div class="tile">
          <div class="tile-lbl">Source</div>
          <div class="tile-val"><em class="a">Webcam</em></div>
          <div class="tile-note">Physical randomness</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const SERVER  = "https://mini-project-a8ql.onrender.com";
const AKEY    = "miniproject825";

let _email = "", _uid = "", _timer = null;

/* ── server check ── */
async function checkServer() {
  const el = document.getElementById("srv-status");
  try {
    const r = await fetch(SERVER + "/", { signal: AbortSignal.timeout(6000) });
    if (!r.ok) throw 0;
    el.className = "status-row good";
    el.innerHTML = `<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="5.5" stroke="#00c97a" stroke-width="1.1"/><path d="M4 6.5l1.8 1.8L9.5 5" stroke="#00c97a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg> Server online`;
  } catch {
    el.className = "status-row bad";
    el.innerHTML = `⚠ Server unreachable`;
  }
}
checkServer();

/* ── nav ── */
function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  document.getElementById(id).classList.add("on");
}
function gotoLogin() {
  clearInterval(_timer);
  show("v-login");
  checkServer();
}

/* ── helpers ── */
function setMsg(id, txt, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = txt;
  el.className = "msg" + (type ? " " + type : "");
}
function shakeInp(id) {
  const el = document.getElementById(id);
  el.classList.add("err");
  setTimeout(() => el.classList.remove("err"), 1600);
}

/* ── login ── */
async function doLogin() {
  const email = document.getElementById("f-email").value.trim().toLowerCase();
  const pass  = document.getElementById("f-pass").value;
  setMsg("f-email-msg",""); setMsg("f-pass-msg","");

  if (!email) { shakeInp("f-email"); setMsg("f-email-msg","Required","err"); return; }
  if (!pass)  { shakeInp("f-pass");  setMsg("f-pass-msg","Required","err"); return; }

  const btn = document.getElementById("btn-login");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin a"></span>`;

  _email = email;
  try { localStorage.setItem("entropyauth_email", email); } catch {}

  let uid = localStorage.getItem("entropyauth_uid") || "";
  try {
    const r = await fetch(`${SERVER}/lookup?email=${encodeURIComponent(email)}&admin_key=${AKEY}`);
    const d = await r.json();
    if (d.found && d.uid) uid = d.uid;
  } catch {}
  _uid = uid;

  btn.disabled = false;
  btn.innerHTML = "Continue";

  // populate OTP screen
  const uidInp = document.getElementById("f-uid");
  if (uid) {
    uidInp.value = uid;
    document.getElementById("uid-tag").textContent = "✓";
    setMsg("f-uid-msg", "");
  } else {
    uidInp.value = "";
    uidInp.placeholder = "Not registered — open the app first";
    document.getElementById("uid-tag").textContent = "";
    setMsg("f-uid-msg", "Sign in with Google in the EntropyAuth app, then return here.", "err");
  }

  document.getElementById("f-otp").value = "";
  setMsg("f-otp-msg","");
  startTimer();
  show("v-otp");
  document.getElementById("f-otp").focus();
}

/* ── timer ── */
function startTimer() {
  clearInterval(_timer);
  _timer = setInterval(() => {
    const s = 30 - (Math.floor(Date.now()/1000) % 30);
    document.getElementById("tfill").style.width = (s/30*100)+"%";
  }, 500);
}

/* ── otp input ── */
function otpInput(el) {
  el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
}
function otpPaste(e) {
  const txt = (e.clipboardData||window.clipboardData).getData("text")
    .replace(/[^A-Za-z0-9]/g,"").toUpperCase().slice(0,8);
  if (txt) {
    e.preventDefault();
    document.getElementById("f-otp").value = txt;
  }
}

/* ── verify ── */
async function doVerify() {
  let uid = document.getElementById("f-uid").value.trim();
  setMsg("f-otp-msg","");

  if (!uid) {
    try {
      const r = await fetch(`${SERVER}/lookup?email=${encodeURIComponent(_email)}&admin_key=${AKEY}`);
      const d = await r.json();
      if (d.found) { uid = d.uid; document.getElementById("f-uid").value = uid; document.getElementById("uid-tag").textContent = "✓"; }
    } catch {}
  }

  const code = document.getElementById("f-otp").value.trim().toUpperCase();
  const btn  = document.getElementById("btn-verify");

  if (!uid)         { setMsg("f-uid-msg","Open the EntropyAuth app and sign in first","err"); return; }
  if (code.length < 6) { shakeInp("f-otp"); setMsg("f-otp-msg","Enter the full 8-character code","err"); return; }

  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span>`;

  try {
    const r = await fetch(`${SERVER}/verify`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ api_key: AKEY, uid, code })
    });
    const d = await r.json();
    if (d.valid) {
      clearInterval(_timer);
      gotoDash(d.email || _email);
    } else {
      setMsg("f-otp-msg", d.error || "Incorrect code — try again", "err");
      shakeInp("f-otp");
      btn.disabled = false;
      btn.innerHTML = "Verify";
    }
  } catch {
    setMsg("f-otp-msg","Cannot reach server","err");
    btn.disabled = false;
    btn.innerHTML = "Verify";
  }
}

/* ── dashboard ── */
function gotoDash(email) {
  const name = (email||"user").split("@")[0];
  const now  = new Date();
  const pad  = n => String(n).padStart(2,"0");
  document.getElementById("d-name").textContent   = name;
  document.getElementById("d-email").textContent  = email || "—";
  document.getElementById("d-email2").textContent = email || "—";
  document.getElementById("d-time").textContent   =
    pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  show("v-dash");
}

/* ── pre-fill + keyboard ── */
window.addEventListener("load", () => {
  const s = localStorage.getItem("entropyauth_email");
  if (s) document.getElementById("f-email").value = s;
  document.getElementById("f-email").addEventListener("change", e =>
    { try { localStorage.setItem("entropyauth_email", e.target.value.trim().toLowerCase()); } catch {} });
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const on = document.querySelector(".view.on");
  if (!on) return;
  if (on.id === "v-login") doLogin();
  else if (on.id === "v-otp") doVerify();
});
</script>
</body>
</html>
